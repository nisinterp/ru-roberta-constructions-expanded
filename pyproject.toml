[project]
name = "ru-constructions-expanded"
version = "0.1.0"
description = "Expanded Russian Constructicon masked-word recovery study"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["upstream", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
